<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Làng Cổ Tích</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- A1: Màn hình mở đầu -->
<div class="veil show" id="titleVeil">
  <div class="title-card">
    <div class="t-parade" id="tParade"></div>
    <div class="eyebrow">Trò chơi xếp hình cổ tích Việt Nam</div>
    <h1 class="t-logo">Làng <span class="tilde">Cổ Tích</span></h1>
    <button class="btn primary t-start" id="startBtn">Bắt đầu chơi</button>
    <button class="btn t-hoi" id="hoiBtn">🏮 Vào hội làng</button>
    <button class="btn t-over" id="startOver" style="display:none">Chơi lại từ đầu</button>
  </div>
</div>

<header>
  <div class="eyebrow" id="chapterName">Chương 1 · Tấm Cám</div>
  <h1>Làng <span class="tilde">Cổ Tích</span></h1>
  <div class="dots" id="dots"></div>
</header>

<!-- Chế độ Hội làng: chọn bậc rồi chơi đề vô tận -->
<div class="veil" id="hlVeil">
  <div class="title-card hl-card">
    <div class="t-parade" id="hlParade"></div>
    <div class="eyebrow">Chơi riêng · đề sinh vô tận</div>
    <h1 class="t-logo">Hội <span class="tilde">làng</span></h1>
    <p class="hl-luat">Mỗi hàng một người · mỗi cột một người<br>ai cũng cần một khoảng trống quanh mình</p>
    <div class="hl-bac">
      <button class="btn hl-pick" data-kho="dễ">Dễ</button>
      <button class="btn hl-pick primary" data-kho="vừa">Vừa</button>
      <button class="btn hl-pick" data-kho="khó">Khó</button>
    </div>
    <div class="hl-dem" id="hlDem"></div>
    <button class="btn t-over" id="hlDong">← Về màn hình chính</button>
  </div>
</div>

<!-- Dải báo tin (nhặt di vật…) — tự ẩn sau vài giây -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="game">
  <aside class="panel">
    <div class="scene" id="scene"></div>
    <div class="chips" id="chips"></div>
    <div class="bar">
      <button class="btn" id="reset">Xếp lại</button>
      <button class="btn" id="bagBtn">🧺 Túi đồ</button>
      <button class="btn" id="hintBtn" aria-label="Gợi ý">💡 Gợi ý</button>
      <button class="btn" id="sndBtn" aria-label="Bật tắt âm thanh">🔉</button>
    </div>
  </aside>
  <section class="stage">
    <div class="stage-inner" id="stagebox"></div>
    <div class="nameplate" id="nameplate"></div>
    <div class="tray" id="tray"></div>
  </section>
</div>

<div class="veil" id="veil">
  <div class="win">
    <h2 id="winTitle">Giỏi quá!</h2>
    <div id="stampAward"></div>
    <button class="say say-win" id="sayWin" aria-label="Đọc to lời kể">🔊 nghe kể</button>
    <p id="winStory"></p>
    <button class="btn" id="againBtn">Chơi lại màn</button>
    <button class="btn primary" id="nextBtn">Màn tiếp theo</button>
  </div>
</div>

<!-- Script thường (không dùng ES module) để mở trực tiếp bằng file:// vẫn chạy -->
<div class="veil" id="bagVeil">
  <div class="win bag">
    <h2 id="bagTitle">Túi đồ</h2>
    <div class="bag-grid" id="bagGrid"></div>
    <button class="btn" id="parentBtn">👪 Góc cha mẹ</button>
    <button class="btn" id="resetSave">Chơi lại từ đầu</button>
    <button class="btn primary" id="bagClose">Đóng</button>
  </div>
</div>

<div class="veil" id="parentVeil">
  <div class="win parent">
    <h2>👪 Góc cha mẹ</h2>
    <div id="parentBody"></div>
    <button class="btn primary" id="parentClose">Đóng</button>
  </div>
</div>

<script src="js/sound.js"></script>
<script src="js/art.js"></script>
<script src="js/hoilang.js"></script>
<script src="js/chapters/chapter1.js"></script>
<script src="js/chapters/chapter2.js"></script>
<script src="js/chapters/chapter3.js"></script>
<script src="js/chapters/chapter4.js"></script>
<script src="js/chapters/chotet.js"></script>
<script src="js/chapters/chapter5.js"></script>
<script src="js/chapters/chapter6.js"></script>
<script src="js/chapters/chapter7.js"></script>
<script src="js/chapters/chapter8.js"></script>
<script src="js/chapters/hoilang.js"></script>
<script src="js/skills.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<!-- Gỡ lỗi: tua màn + đo độ chặt của màn. Xoá 2 dòng này khi phát hành. -->
<script src="js/dev.js"></script>
<script src="js/audit.js"></script>
</body>
</html>
